site:
  title: Axon Workflow Engine docs PREVIEW
  start_page: axon-framework-reference::index.adoc

content:
  sources:
  - url: localLinks/AxonFramework   # include docs from Axon Framework repo
    start_paths: ['docs/*', '!docs/_*', '!docs/reference/*']
  - url: ../..
    start_paths: ['docs/*', '!docs/_*']

asciidoc:
  attributes:
    experimental: true
    page-pagination: true
    kroki-fetch-diagram: true
    primary-site-manifest-url: https://library.axoniq.io/site-manifest.json
    workflows: true
  extensions:
  - asciidoctor-kroki
  - '@asciidoctor/tabs'

antora:
  extensions:
  - id: prose-linting
    require: '@axoniq/antora-vale-extension'
    enabled: true
    vale_config: .vale.ini
    update_styles: true
  - id: lunr
    require: '@antora/lunr-extension'
    enabled: true
    index_latest_only: true
  - id: atlas
    require: '@antora/atlas-extension'

runtime:
  fetch: true
  log:
    level: info
    failure_level: error

ui:
  bundle:
    url: https://github.com/AxonIQ/axoniq-library-ui/releases/latest/download/ui-bundle.zip
    snapshot: true
  supplemental_files: supplemental-ui
