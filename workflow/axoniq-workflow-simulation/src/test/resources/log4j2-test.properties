# Simulation-module test logging: the shared defaults (dependencies ERROR, Axoniq and Axon Framework WARN) plus the
# scenario outcome lines the DST tests log at INFO, which are the measurements a campaign report quotes. The harness
# itself logs nothing at INFO, so the volume stays one line per arm.

name=AxoniqWorkflowSimulationTestConfiguration

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %-30.30logger{1} - %msg%n

rootLogger.level = ERROR
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT

logger.axoniq-framework.name = io.axoniq.framework
logger.axoniq-framework.level = WARN
logger.axoniq-framework.additivity = false
logger.axoniq-framework.appenderRefs = stdout
logger.axoniq-framework.appenderRef.stdout.ref = STDOUT

logger.simulation.name = io.axoniq.framework.workflow.simulation
logger.simulation.level = INFO
logger.simulation.additivity = false
logger.simulation.appenderRefs = stdout
logger.simulation.appenderRef.stdout.ref = STDOUT

logger.axon.name = org.axonframework
logger.axon.level = WARN
logger.axon.additivity = false
logger.axon.appenderRefs = stdout
logger.axon.appenderRef.stdout.ref = STDOUT
