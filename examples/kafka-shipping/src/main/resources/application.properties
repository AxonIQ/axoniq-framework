spring.application.name=kafka-shipping
axon.axonserver.enabled=false

axon.kafka.bootstrap-servers=localhost:9092

# The sink that ParcelPublisher publishes through. Records are keyed by parcel, so that the events of a parcel stay in
# order.
axon.kafka.sinks.parcels.topic=parcels
axon.kafka.sinks.parcels.record-key-metadata=parcelId

# The source that the tracking projection reads.
axon.kafka.streaming-sources.parcel-stream.topics=parcels

# Event handlers are grouped in a processor per package. The tracking projection reads from Kafka; the publisher reads
# from the event store.
axon.eventhandling.processors[io.axoniq.framework.examples.kafka.tracking].source=parcel-stream
