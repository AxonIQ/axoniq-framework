# Everything the rig varies per node (rig.node-id, spring.datasource.url, axon.axonserver.servers,
# axoniq.workflow.initial-segment-count) arrives as a -D system property from ShardCluster.
spring:
  application:
    name: shard-node
  main:
    banner-mode: off
  datasource:
    driver-class-name: org.postgresql.Driver
    username: rig
    password: rig
    hikari:
      maximum-pool-size: 10
      # Short on purpose: a partitioned node must fail fast and visibly rather than block a scenario for 30 seconds.
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    hibernate:
      # The rig creates rig_step_log itself and lets the first node create TokenEntry; nodes are started one at a
      # time, so no two Hibernate instances issue DDL concurrently.
      ddl-auto: update
    open-in-view: false
server:
  port: 0
  shutdown: graceful
logging:
  level:
    root: WARN
    io.axoniq.framework.workflow: INFO
    org.axonframework.messaging.eventhandling.processing.streaming: INFO
