site:
  title: Axon Framework docs PREVIEW
  start_page: axon-framework-reference::index.adoc

content:
  sources:
  - url: https://github.com/AxonIQ/AxonFramework.git   # include docs from Axon Framework repo
    start_paths: ['docs/*', '!docs/_*', '!docs/reference/*'] # from every folder in `docs` except those starting with underscore
    branches: [ 'main' ]
  - url: https://github.com/AxonIQ/extension-data-protection.git # include docs from extension-data-protection repo
    start_paths: [ 'docs/*', '!docs/_*' ]   # from every folder in `docs` except those starting with underscore
    branches: [ 'main' ]
  - url: https://github.com/AxonIQ/extension-workflow.git # include docs from extension-data-protection repo
    start_paths: [ 'docs/*', '!docs/_*' ]   # from every folder in `docs` except those starting with underscore
    branches: [ 'main' ]
  - url: ../..
    start_paths: ['docs/*', '!docs/_*', '!docs/reference/*']
    branches: [ 'HEAD', 'main' ] # HEAD keeps the triggering branch's own version. "main" keeps the `development` version complete regardless of which branch triggered the build

asciidoc:
  attributes:
    experimental: true
    page-pagination: true
    kroki-fetch-diagram: true
    primary-site-manifest-url: https://library.axoniq.io/site-manifest.json
    advanced-framework: true
    data-protection: true
    workflows: true
  extensions:
  - asciidoctor-kroki
  - '@asciidoctor/tabs'

antora:
  extensions:
  - id: prose-linting
    require: '@axoniq/antora-vale-extension'
    enabled: true
    vale_config: .vale.ini
    update_styles: true
  - id: lunr
    require: '@antora/lunr-extension'
    enabled: true
    index_latest_only: true
  - id: atlas
    require: '@antora/atlas-extension'

runtime:
  fetch: true # fetch remote repos
  log:
    level: info
    failure_level: error

ui:
  bundle:
    url: https://github.com/AxonIQ/axoniq-library-ui/releases/latest/download/ui-bundle.zip
    snapshot: true # forces Antora to skip the cache for the ui-bundle
