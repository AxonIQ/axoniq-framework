# Spring Boot Application Configuration
spring.application.name=data-protection-sample

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=demo
spring.datasource.password=demo
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=dataprotection
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jpa.compliance.proxy=false
spring.jpa.entity-manager-factory-interface=jakarta.persistence.EntityManagerFactory

# Flyway Configuration
spring.flyway.locations=classpath:/db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=dataprotection

# Axon Framework Configuration
axon.serializer.general=jackson
axon.serializer.messages=jackson
axon.serializer.events=jackson

# Event Processor Configuration
# AF5 Note: There is no 'tracking' mode in AF5. All streaming processors use PooledStreamingEventProcessor.
# Token reset is handled by the EventProcessorResetService which manually deletes tokens and restarts processors.

# Logging Configuration
logging.level.root=INFO
logging.level.io.axoniq.framework.extension.dataprotection.sample=DEBUG
logging.level.org.axonframework=INFO
