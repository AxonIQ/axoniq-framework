<svg xmlns="http://www.w3.org/2000/svg" width="760" height="662" viewBox="0 0 760 662" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="660" rx="8" fill="#ffffff" stroke="#d1d5db"/>

  <rect x="24" y="12" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="42" y="22" font-size="11" fill="#2C2C2A">framework / connector</text>
  <rect x="210" y="12" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="228" y="22" font-size="11" fill="#2C2C2A">custom (multi-tenancy)</text>
  <text x="400" y="22" font-size="11" font-weight="500" fill="#534AB7">write flow</text>
  <text x="478" y="22" font-size="11" font-weight="500" fill="#0F6E56">read flow</text>

  <rect x="40" y="42" width="300" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="190" y="66" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">Command handler</text>
  <rect x="400" y="42" width="300" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="550" y="66" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">Pooled streaming processor</text>

  <path d="M190 82 L300 116" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="34" y="104" font-size="12" font-weight="500" fill="#534AB7">transaction / publish (ctx)</text>
  <path d="M550 82 L480 116" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="556" y="104" font-size="12" font-weight="500" fill="#0F6E56">open / firstToken (cond, ctx)</text>

  <rect x="240" y="118" width="300" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="390" y="138" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">InterceptingEventStore</text>
  <line x1="390" y1="150" x2="390" y2="162" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="240" y="162" width="300" height="42" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="390" y="181" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">StorageEngineBackedEventStore</text>
  <text x="390" y="196" font-size="11" fill="#5F5E5A" text-anchor="middle">EventStore + the default StreamableEventSource</text>
  <line x1="390" y1="204" x2="390" y2="236" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="240" y="236" width="300" height="42" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="390" y="255" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">SnapshotCapableEventStorageEngine</text>
  <text x="390" y="270" font-size="11" fill="#5F5E5A" text-anchor="middle">framework auto-wrap</text>

  <path d="M320 278 L216 300" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M470 278 L566 300" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="486" y="294" font-size="11" fill="#5F5E5A">load / store (ctx)</text>

  <rect x="60" y="300" width="300" height="88" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="210" y="320" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle">MultiTenantEventStorageEngine</text>
  <text x="210" y="341" font-size="11" fill="#534AB7" text-anchor="middle">writes -&gt; route: appendEvents / source</text>
  <text x="210" y="359" font-size="11" fill="#0F6E56" text-anchor="middle">reads -&gt; merge: stream / firstToken / tokenAt</text>
  <text x="210" y="378" font-size="10" fill="#5F5E5A" text-anchor="middle">MergedMessageStream + MultiTenantTrackingToken</text>

  <rect x="420" y="300" width="300" height="44" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="570" y="320" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle">MultiTenantSnapshotStore</text>
  <text x="570" y="336" font-size="11" fill="#534AB7" text-anchor="middle">routes load / store by tenant</text>

  <line x1="210" y1="388" x2="210" y2="414" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="218" y="405" font-size="11" fill="#5F5E5A">apply(tenant)</text>
  <line x1="570" y1="344" x2="570" y2="414" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="578" y="382" font-size="11" fill="#5F5E5A">apply(tenant)</text>

  <rect x="60" y="414" width="300" height="48" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="210" y="433" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">TenantEventStorageEngineFactory</text>
  <text x="210" y="449" font-size="11" fill="#534AB7" text-anchor="middle">lazy create, evict on tenant removal</text>
  <rect x="420" y="414" width="300" height="48" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="570" y="433" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">TenantSnapshotStoreFactory</text>
  <text x="570" y="449" font-size="11" fill="#534AB7" text-anchor="middle">lazy create, evict on tenant removal</text>

  <rect x="40" y="474" width="680" height="90" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="4 3"/>
  <text x="380" y="491" font-size="11" fill="#5F5E5A" text-anchor="middle">one per tenant, on the tenant's Axon Server connection</text>
  <rect x="60" y="502" width="300" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="210" y="526" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">AxonServerEventStorageEngine</text>
  <rect x="420" y="502" width="300" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="570" y="526" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">AxonServerSnapshotStore</text>
  <line x1="210" y1="462" x2="210" y2="502" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="462" x2="570" y2="502" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M210 542 L210 574 L362 588" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M570 542 L570 574 L418 588" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="588" width="180" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="390" y="609" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">tenant's Axon Server context</text>

  <text x="40" y="646" font-size="10" fill="#5F5E5A">A tenant change restarts the processor, re-opening the merged read stream (MultiTenantStreamingProcessorRestarter).</text>
</svg>
