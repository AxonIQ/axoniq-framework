<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="818" height="558" rx="8" fill="#ffffff" stroke="#d1d5db"/>

  <rect x="24" y="12" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="42" y="22" font-size="11" fill="#2C2C2A">framework / core / connector</text>
  <rect x="250" y="12" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="268" y="22" font-size="11" fill="#2C2C2A">custom (multi-tenancy)</text>
  <text x="470" y="22" font-size="11" font-weight="500" fill="#0F6E56">read flow</text>
  <text x="548" y="22" font-size="11" font-weight="500" fill="#B45309">restart on tenant change</text>

  <rect x="230" y="40" width="300" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="380" y="64" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">Pooled streaming processor</text>
  <path d="M380 80 L380 104" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="388" y="96" font-size="11" font-weight="500" fill="#0F6E56">stream(condition)</text>

  <rect x="230" y="104" width="300" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="380" y="124" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">StorageEngineBackedEventStore</text>
  <text x="380" y="139" font-size="11" fill="#5F5E5A" text-anchor="middle">EventStore + default StreamableEventSource</text>
  <line x1="380" y1="148" x2="380" y2="172" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="210" y="172" width="340" height="52" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="380" y="192" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle">MultiTenantEventStorageEngine</text>
  <text x="380" y="210" font-size="11" fill="#0F6E56" text-anchor="middle">stream / firstToken / latestToken / tokenAt</text>

  <rect x="636" y="176" width="150" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="711" y="197" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">TenantProvider</text>
  <path d="M711 210 L711 360 L534 360" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="600" y="352" font-size="10" fill="#5F5E5A">tenant lifecycle</text>

  <rect x="612" y="42" width="176" height="46" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="700" y="61" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">MultiTenantStreaming</text>
  <text x="700" y="77" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">ProcessorRestarter</text>
  <path d="M550 186 L624 186 L624 88" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="628" y="130" font-size="10" fill="#B45309">tenant change,</text>
  <text x="628" y="143" font-size="10" fill="#B45309">once registered</text>
  <path d="M612 65 L534 65" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="559" y="60" font-size="10" font-weight="500" fill="#B45309">restart</text>

  <path d="M380 224 L380 248" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="388" y="240" font-size="11" fill="#5F5E5A">composes</text>

  <rect x="200" y="248" width="360" height="66" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="380" y="268" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">engine read composition</text>
  <text x="380" y="285" font-size="11" fill="#534AB7" text-anchor="middle">MergedMessageStream (oldest event first, by timestamp)</text>
  <text x="380" y="302" font-size="11" fill="#534AB7" text-anchor="middle">TenantPositioningStream (MultiTenantTrackingToken)</text>

  <path d="M380 314 L380 338" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="388" y="330" font-size="11" fill="#5F5E5A">reads tenants and their engines via</text>

  <rect x="230" y="338" width="300" height="44" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="380" y="357" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle">per-tenant composed engines</text>
  <text x="380" y="373" font-size="11" fill="#534AB7" text-anchor="middle">engineFor(tenant), tenants()</text>

  <path d="M300 382 L200 418" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M460 382 L560 418" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="410" width="700" height="88" rx="8" fill="none" stroke="#B4B2A9" stroke-dasharray="4 3"/>
  <text x="380" y="427" font-size="11" fill="#5F5E5A" text-anchor="middle">one per current tenant, each tagged withResource(TenantDescriptor.RESOURCE_KEY, tenant)</text>
  <rect x="60" y="438" width="300" height="46" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="210" y="457" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">tenant A event store</text>
  <text x="210" y="473" font-size="10" fill="#5F5E5A" text-anchor="middle">stream(conditionFor(tokenForTenant, criteria))</text>
  <rect x="420" y="438" width="300" height="46" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="570" y="457" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">tenant B event store</text>
  <text x="570" y="473" font-size="10" fill="#5F5E5A" text-anchor="middle">stream(conditionFor(tokenForTenant, criteria))</text>

  <text x="40" y="522" font-size="10" fill="#5F5E5A">Each entry carries its tenant. The framework copies it onto the per-event ProcessingContext, so a handler writes to that tenant's projection.</text>
  <text x="40" y="540" font-size="10" fill="#5F5E5A">Restarts are coalesced onto one thread and bounded by MultiTenantStreamingProcessorRestartConfiguration (default 30 seconds).</text>
</svg>
