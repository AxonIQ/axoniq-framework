\* Per-instance claim seeding (the shipped design of "Seed each restored workflow from its own
\* sourcing position"): every instance of the claim is sourced in a unit of work of its own, so its
\* seed is the head of the store at its own read.
\* EXPECT: No error -- NoSelfFence holds.
SPECIFICATION Spec

CONSTANTS
    Instances = {i1, i2}
    MaxStore = 5
    PerInstanceSeed = TRUE

CONSTRAINT StoreBound
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NoSelfFence
