\* One transaction shared by every instance of the claim: its append position is the lowest of its
\* reads, so an instance read after a previous owner wrote is seeded before its own last event.
\* EXPECT: NoSelfFence violated -- the refutable twin of MC_claimseed.cfg.
SPECIFICATION Spec

CONSTANTS
    Instances = {i1, i2}
    MaxStore = 5
    PerInstanceSeed = FALSE

CONSTRAINT StoreBound
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NoSelfFence
