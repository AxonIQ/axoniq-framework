\* Fencing ON plus MarkerRegress: the lost-update race in
\* ConsistencyMarkerSupport.updateAppendPosition (non-atomic read-upperBound-
\* write of the volatile marker) non-deterministically moves a writer's marker
\* BACKWARD.
\* EXPECT: SiblingNoFalseConflict VIOLATED -- a single active writer's own next
\* append is rejected against its own history (marker regressed below its own
\* last write), so a lone healthy writer gets interrupted for no reason.
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    MaxStore = 6
    ConditionalAppends = TRUE
    MarkerRegressEnabled = TRUE

CONSTRAINT StoreBound
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT SiblingNoFalseConflict
