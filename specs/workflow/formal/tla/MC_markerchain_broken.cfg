\* Fencing OFF (ConditionalAppends = FALSE): every append commits
\* unconditionally -- the pre-DCB world. Proves the model is refutable.
\* EXPECT: VIOLATED. TLC reports the shallowest violation, OneStartPerInstance
\* (both writers spawn: two Started records). AtMostOnceRecording is violable
\* too on a deeper trace (spawn, restore by the second writer, both commit
\* StepTerm for the same step) -- checked by running this cfg with only that
\* invariant listed.
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    MaxStore = 6
    ConditionalAppends = FALSE
    MarkerRegressEnabled = FALSE

CONSTRAINT StoreBound
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT OneStartPerInstance
INVARIANT AtMostOnceRecording
