\* Run 4 (Step C.4): liveness. Check the temporal property EventuallyTerminates
\* under FairSpec (weak fairness on Claim/Recover so a down proc comes back, and
\* on Progress so a live owner keeps driving steps). Crashes are bounded by
\* MaxCrashes, so after the last crash the fair actions carry the single instance
\* to terminal (all steps COMPLETED). Durable lease + append-condition ON so the
\* run is the intended happy path (no split-brain, no double-effect).
\* EXPECT: No error (the property holds at this scope).
SPECIFICATION FairSpec

CONSTANTS
    Procs = {p1, p2}
    Steps = {1, 2, 3}
    MaxLogLen = 6
    MaxCrashes = 2
    DURABLE_LEASE = TRUE
    APPEND_CONDITION = TRUE

\* No SYMMETRY here: TLC warns that symmetry during liveness checking can MISS
\* property violations, so liveness is checked over the full (un-symmetrised)
\* state space.
INVARIANT TypeOK
PROPERTY EventuallyTerminates
