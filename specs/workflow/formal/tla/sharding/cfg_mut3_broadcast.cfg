\* Broadcast fan-in switched ON, at the same bound as cfg_fixed3 (3 segments, 3 instances, 7 events).
\*
\* Every other configuration sets OwnershipGuards = TRUE, and under that constant a bstart/wake
\* delivered to a non-owning segment changes no variable at all: the broadcast branch is off, so
\* SpawnExactlyOnce and WakeExactlyOnce are checked against a space in which fan-in never happens.
\* This configuration is the same model with the guards removed, so a non-owning segment really does
\* act on a broadcast event, and it checks all three ownership invariants against that.
\*
\* Expected: violated. The shouldHandle/shouldSpawn guards are the whole mechanism; nothing else in
\* the engine stops a second segment acting on a broadcast delivery. Run with -continue to explore
\* the whole broadcast-enabled space rather than stopping at the first counterexample.
SPECIFICATION Spec
CONSTANTS
  ScopedClaimRestore = TRUE
  ClaimRestoreChecksLiveMode = TRUE
  PerSegmentLiveMode = TRUE
  SyncRelease = TRUE
  ExtraSegment = TRUE
  OwnershipGuards = FALSE
INVARIANTS
  SpawnExactlyOnce
  WakeExactlyOnce
  OneInstanceOneOwner
