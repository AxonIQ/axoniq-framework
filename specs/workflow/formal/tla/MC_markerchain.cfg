\* DCB marker-chain fencing ON (the shipped design of "Introduce DCB append
\* conditions"): conditional appends checked from the per-writer marker, spawn
\* checked from ORIGIN, restore seeds from head, rejection interrupts.
\* EXPECT: No error -- OneStartPerInstance, AtMostOnceRecording,
\* NoWriteAfterOwnershipLoss, SiblingNoFalseConflict all hold, and a rejection
\* never advances the marker (RejectionNeverAdvancesMarker).
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    MaxStore = 6
    ConditionalAppends = TRUE
    MarkerRegressEnabled = FALSE

CONSTRAINT StoreBound
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT OneStartPerInstance
INVARIANT AtMostOnceRecording
INVARIANT NoWriteAfterOwnershipLoss
INVARIANT SiblingNoFalseConflict

PROPERTY RejectionNeverAdvancesMarker
