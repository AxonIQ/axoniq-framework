\* Run 1 (Step C.1): single-writer + append-condition. The three "always-holds"
\* safety invariants INV-2/3/4 must report No error.
\* DURABLE_LEASE=TRUE (mutual-exclusion lease), APPEND_CONDITION=TRUE (FIXME fix).
SPECIFICATION Spec

CONSTANTS
    Procs = {p1, p2}
    Steps = {1, 2, 3}
    MaxLogLen = 6
    MaxCrashes = 2
    DURABLE_LEASE = TRUE
    APPEND_CONDITION = TRUE

SYMMETRY ProcSymmetry

INVARIANT TypeOK
INVARIANT AtMostOnceRecording
INVARIANT DeterministicReplay

\* CommittedHistorySurvivesCrash is an action property ([][Crash => log'=log]),
\* so it is declared as a PROPERTY (temporal), not a state INVARIANT.
PROPERTY CommittedHistorySurvivesCrash
