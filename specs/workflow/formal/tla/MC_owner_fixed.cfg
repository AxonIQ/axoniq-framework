    Procs = {p1, p2}
    Steps = {1, 2, 3}
    MaxLogLen = 6
    MaxCrashes = 2
    DURABLE_LEASE = TRUE
    APPEND_CONDITION = TRUE

SYMMETRY ProcSymmetry

INVARIANT TypeOK
INVARIANT AtMostOneOwner
