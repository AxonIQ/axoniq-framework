\* single-writer lease turned ON (DURABLE_LEASE=TRUE). A proc may acquire the
\* segment only when no other proc holds it, so the split-brain second claimer
\* is forbidden.
\* EXPECT: No error -- toggling the durable-lease flag closes the F-1 hole.
SPECIFICATION Spec

