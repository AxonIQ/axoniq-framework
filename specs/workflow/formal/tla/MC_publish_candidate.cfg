\* MUTATION: published events candidate-routed (to the started instance's segment only) instead of BROADCAST.
\* Expected: PublisherObservesOwnPublish VIOLATED (the publisher's segment skips its own event, the publisher
\* waits forever) -- and WakeExactlyOnce is violated on the same path (a waiter on a third segment loses its wake).
SPECIFICATION Spec
CONSTANTS
  BROADCAST_PUBLISH = FALSE
  FOREIGN_ID_GUARD = TRUE
  CONTAINS_STEP_GATE = TRUE
INVARIANTS
  PublisherObservesOwnPublish
