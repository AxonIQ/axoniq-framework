version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "Type: Dependency Upgrade"
      - "Priority 1: Must"
    milestone: 6
    groups:
      github-dependencies:
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: maven
    directory: "/"
    exclude-paths:
      - "legacy-support/axoniq-legacy/**"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "Type: Dependency Upgrade"
      - "Priority 1: Must"
    milestone: 6
    groups:
      maven-dependencies:
        update-types:
          - "patch"
          - "minor"
          - "major"
    ignore:
      - dependency-name: "org.springframework:*"
        versions: [ "[7.0.0,)" ]
      - dependency-name: "org.springframework.security:*"
        versions: [ "[7.0.0,)" ]
      - dependency-name: "org.springframework.boot:*"
        versions: [ "[4.0.0,)" ]
      - dependency-name: "org.springframework.cloud:spring-cloud-commons"
        versions: [ "[5.0.0,)" ]
      - dependency-name: "org.springdoc:*"
        versions: [ "[3.0.0,)" ]
      - dependency-name: "org.springframework.data:*"
        versions: [ "[2025.0.0,)" ]
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [ "3.10.0" ]
      - dependency-name: "org.jobrunr:jobrunr"
        versions: [ "[9.0.0,)" ]

  - package-ecosystem: maven
    directory: "/legacy-support/axoniq-legacy"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "Type: Dependency Upgrade"
      - "Priority 1: Must"
    milestone: 6
    groups:
      maven-dependencies:
        update-types:
          - "patch"
          - "minor"
          - "major"
    ignore:
      - dependency-name: "org.axonframework:axon-messaging"
        versions: [ "[5.0.0,)" ]
      - dependency-name: "org.axonframework:axon-modelling"
        versions: [ "[5.0.0,)" ]
      - dependency-name: "org.jobrunr:jobrunr"
        versions: [ "[9.0.0,)" ]
      - dependency-name: "org.quartz-scheduler:quartz"
        versions: [ "[3.0.0,)" ]
      - dependency-name: "com.github.kagkarlsson:db-scheduler"
        versions: [ "[17.0.0,)" ]

  - package-ecosystem: npm
    directory: "/docs/_playbook"
    schedule:
      interval: weekly
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "Type: Dependency Upgrade"
      - "Priority 1: Must"
    milestone: 6
    groups:
      antora-dependencies:
        update-types:
          - "patch"
          - "minor"
          - "major"
    ignore:
      # asciidoctor-kroki 1.x and 2.x require Asciidoctor.js 4 (and 2.x requires Node 22+), but Antora 3.x
      # bundles Asciidoctor.js 2.2. Stay on the 0.x line until Antora ships on Asciidoctor.js 4.
      - dependency-name: "asciidoctor-kroki"
        versions: [">=1.0.0"]
