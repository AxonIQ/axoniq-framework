name: Axoniq Framework - Workflow (DST)

# Deterministic Simulation Testing for the workflow engine's leasing / crash-recovery protocol.
#
#   dst-smoke  — runs on every pull_request and on push to main: the small fixed smoke seed set
#                (fast, < ~1 min of simulation). The seeded loop is structurally incapable of
#                hanging (hard per-run wall-clock deadline + max-steps cap + bounded waits — see
#                workflow/axoniq-workflow-simulation/README.md), so this job is bounded regardless of engine behaviour.
#   dst-fuzz   — runs nightly on a cron schedule: re-enables the "fuzz"-tagged long run and
#                explores many seeds (-Ddst.seeds=N) across the full fault set (incl. write-then-vanish).
#
# This workflow is additive: it does NOT replace the regular module build in main.yml /
# pullrequest.yml (which already compiles the always-on simulation module). It exists to (a) give
# the DST suite its own clearly-labelled signal and (b) host the nightly fuzz sweep.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  schedule:
    # Nightly at 02:30 UTC — the heavy fuzz sweep (see the dst-fuzz job's condition).
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      fuzzSeeds:
        description: 'Number of seeds for an on-demand fuzz run'
        required: false
        default: '500'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dst-smoke:
    name: DST smoke (fast, per-PR) on JDK ${{ matrix.java-version }}
    # Skip on the nightly schedule trigger — that run is for the fuzz job only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 21, 25 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Run DST smoke suite
        # -am builds the runtime/dsl/test dependencies the harness needs; the "fuzz"-tagged long
        # run is excluded by the module's surefire config, so this stays fast. No reruns: the
        # simulation is deterministic, so a failure is a real, reproducible finding.
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -pl workflow/axoniq-workflow-simulation -am test

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "workflow/axoniq-workflow-simulation/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always()

  dst-fuzz:
    name: DST nightly fuzz (many seeds)
    # Runs on the nightly cron and on manual dispatch; never on a pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: 21
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Run DST fuzz sweep
        # -Ddst.excludedGroups= clears the module's default "fuzz" tag exclusion so the long run executes
        # (the simulation pom reads that overridable property); -Dtest=DstFuzzTest scopes the run to the fuzz class
        # and -Dsurefire.failIfNoSpecifiedTests=false stops the -am dependency modules (which have no such test)
        # from failing. -Ddst.seeds sets how many seeds to explore (manual dispatch may override). Each seed's run
        # self-bounds via the harness wall-clock deadline, so a single bad seed aborts fast with its reproduce
        # command instead of stalling the sweep.
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -pl workflow/axoniq-workflow-simulation -am test \
            -Ddst.excludedGroups= -Dtest=DstFuzzTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Ddst.seeds=${{ github.event.inputs.fuzzSeeds || '2000' }}

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "workflow/axoniq-workflow-simulation/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always()
