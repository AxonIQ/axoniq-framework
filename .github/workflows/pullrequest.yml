name: Axoniq Framework (Pull Request)

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: 21
            sonar-enabled: false
          - java-version: 25
            sonar-enabled: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5.4.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Fetch Axon Server License
        env:
          LIBRARY_DEVBOT_TOKEN: ${{ secrets.LIBRARY_DEVBOT_TOKEN }}
        run: |
          if [ -z "${LIBRARY_DEVBOT_TOKEN}" ]; then
            echo "LIBRARY_DEVBOT_TOKEN is not available; skipping Axon Server license download."
            exit 0
          fi
          curl --fail --silent --show-error -H "Authorization: token ${LIBRARY_DEVBOT_TOKEN}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -L "https://api.github.com/repos/AxonIQ/axon-server/contents/dev/developer.license?ref=master" \
               -o integrationtests/src/test/resources/axon-server-test.license

      - name: Regular Build
        if: ${{ !matrix.sonar-enabled }}
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Possrh -Pintegration-test -Djacoco.skip=true clean verify \
          -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2

      - name: Build with Coverage reports
        if: matrix.sonar-enabled
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Possrh -Dcoverage clean verify \
          -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2

      - name: Sonar Analysis
        if: false # ${{ success() && matrix.sonar-enabled && github.event.pull_request.head.repo.full_name == github.repository }} | disabled for the time being
        run: |
          ./mvnw -B -ntp -Dstyle.color=always org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=AxonIQ_axoniq-framework \
          -Dsonar.organization=axoniq \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "**/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always() # This allows the build step to fail -- due to failing tests -- but still produce a test summary.