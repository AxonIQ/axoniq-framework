name: Axoniq Framework (Pull Request)

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The build cache extension defaults to disabled (see .mvn/maven-build-cache-config.xml);
      # CI is the only place with the SNAPSHOT-fingerprinting safety net, so it is the only place
      # that opts back in.
      # The heap/metaspace cap keeps the Maven JVM itself from over-committing memory alongside its
      # forked test JVMs and the containers they start, on this repo's 2-vCPU CI runners. Metaspace
      # needs more headroom than the forked test JVMs: this one process compiles all 35 modules and
      # their annotation processors in-process across the whole reactor, so classes keep accumulating
      # instead of resetting per module like a fresh fork does. 128m was not enough -- it broke the
      # build with a Metaspace OOM partway through the reactor.
      MAVEN_OPTS: -Dmaven.build.cache.enabled=true -Xmx512m -XX:MaxMetaspaceSize=512m
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: 21
          - java-version: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Restore/save Maven build cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/build-cache
          key: maven-build-cache-${{ runner.os }}-jdk${{ matrix.java-version }}-${{ github.run_id }}
          restore-keys: |
            maven-build-cache-${{ runner.os }}-jdk${{ matrix.java-version }}-

      - name: Fingerprint SNAPSHOT dependencies for build cache
        run: ./.github/scripts/fingerprint-snapshot-deps.sh

      - name: Write Axon Server test license
        run: |
          # Written to every module referencing SharedAxonServerContainer: Testcontainers' reuse hash doesn't
          # account for the license file copy, so whichever module's JVM starts the shared container first
          # determines whether it ends up licensed. Without the license present everywhere, an unlicensed
          # module could "poison" the shared container for modules that need multi-context support.
          for dir in integrationtests/support connector/axon-server-connector integrationtests/connector/axon-server integrationtests/conformance dependency-injection/spring/spring-boot-autoconfigure; do
            mkdir -p "$dir/src/test/resources"
            printf '%s' "$AXON_SERVER_LICENSE" > "$dir/src/test/resources/axon-server-test.license"
            echo "Axon Server test license written to $dir/src/test/resources/axon-server-test.license"
            echo "License file size: $(wc -c < "$dir/src/test/resources/axon-server-test.license") bytes"
          done
        env:
          AXON_SERVER_LICENSE: ${{ secrets.AXON_SERVER_LICENSE }}

      - name: Enable Testcontainers reuse
        run: printf 'testcontainers.reuse.enable=true\n' > ~/.testcontainers.properties

      - name: Regular Build
        run: |
          set -o pipefail
          ./mvnw -B -U -ntp -Dstyle.color=always -fae -Possrh -Pintegration-test -Djacoco.skip=true clean verify \
          -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2 -DforkedProcessTimeoutInSeconds=600 2>&1 | tee build.log
        env:
          AXONIQ_LICENSE: ${{ secrets.AXON_SERVER_LICENSE }}

      - name: Generate build status report
        if: always()
        run: |
          if [ -f build.log ]; then
            ./.github/scripts/generate-build-report.sh build.log "JDK ${{ matrix.java-version }}" build-report.md \
              || echo "#### JDK ${{ matrix.java-version }} - _Could not generate the per-module status table (a script error, not a build failure) -- see the 'Generate build status report' step log for details._" > build-report.md
          else
            echo "#### JDK ${{ matrix.java-version }} - _Build did not reach the Maven build step; no per-module status available._" > build-report.md
          fi

      - name: Upload build status report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report-jdk${{ matrix.java-version }}
          path: build-report.md
          retention-days: 1

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "**/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always() # This allows the build step to fail -- due to failing tests -- but still produce a test summary.

  report:
    name: Post build status comment
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download build status reports
        uses: actions/download-artifact@v8
        with:
          pattern: build-report-jdk*
          path: reports

      - name: Combine reports and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build status ([run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), commit ${{ github.event.pull_request.head.sha }})"
            for dir in reports/build-report-jdk*/; do
              jdk="$(basename "$dir" | sed 's/build-report-jdk//')"
              echo
              if [ -f "${dir}build-report.md" ]; then
                cat "${dir}build-report.md"
              else
                echo "#### JDK ${jdk} - _No report available for this leg._"
              fi
            done
          } > combined-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --edit-last --create-if-none --body-file combined-report.md
