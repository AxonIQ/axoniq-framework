name: Axoniq Framework (Pull Request)

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The build cache extension defaults to disabled (see .mvn/maven-build-cache-config.xml);
      # CI is the only place with the SNAPSHOT-fingerprinting safety net, so it is the only place
      # that opts back in.
      MAVEN_OPTS: -Dmaven.build.cache.enabled=true
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: 21
            sonar-enabled: false
          - java-version: 25
            sonar-enabled: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Restore/save Maven build cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/build-cache
          key: maven-build-cache-${{ runner.os }}-jdk${{ matrix.java-version }}-${{ github.run_id }}
          restore-keys: |
            maven-build-cache-${{ runner.os }}-jdk${{ matrix.java-version }}-

      - name: Fingerprint SNAPSHOT dependencies for build cache
        run: ./.github/scripts/fingerprint-snapshot-deps.sh

      - name: Write Axon Server test license
        run: |
          mkdir -p integrationtests/src/test/resources
          printf '%s' "$AXON_SERVER_LICENSE" > integrationtests/src/test/resources/axon-server-test.license
          echo "Axon Server test license written to integrationtests/src/test/resources/axon-server-test.license"
          echo "License file size: $(wc -c < integrationtests/src/test/resources/axon-server-test.license) bytes"
        env:
          AXON_SERVER_LICENSE: ${{ secrets.AXON_SERVER_LICENSE }}

      - name: Regular Build
        if: ${{ !matrix.sonar-enabled }}
        run: |
          set -o pipefail
          ./mvnw -B -U -ntp -Dstyle.color=always -fae -Possrh -Pintegration-test -Djacoco.skip=true clean verify \
          -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2 2>&1 | tee build.log

      - name: Build with Coverage reports
        if: matrix.sonar-enabled
        run: |
          set -o pipefail
          ./mvnw -B -U -ntp -Dstyle.color=always -fae -Possrh -Dcoverage clean verify \
          -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2 2>&1 | tee build.log

      - name: Generate build status report
        if: always()
        run: |
          if [ -f build.log ]; then
            ./.github/scripts/generate-build-report.sh build.log "JDK ${{ matrix.java-version }}" build-report.md \
              || echo "_Build status report generation failed; see the raw build log for details._" > build-report.md
          else
            echo "_Build did not reach the Maven build step; no per-module status available._" > build-report.md
          fi

      - name: Upload build status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-jdk${{ matrix.java-version }}
          path: build-report.md
          retention-days: 1

      - name: Sonar Analysis
        if: false # ${{ success() && matrix.sonar-enabled && github.event.pull_request.head.repo.full_name == github.repository }} | disabled for the time being
        run: |
          ./mvnw -B -ntp -Dstyle.color=always org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=AxonIQ_axoniq-framework \
          -Dsonar.organization=axoniq \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test summary
        uses: test-summary/action@v2
        with:
          paths: "**/target/surefire-reports/TEST-*.xml"
          show: "fail, skip"
        if: always() # This allows the build step to fail -- due to failing tests -- but still produce a test summary.

  report:
    name: Post build status comment
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download build status reports
        uses: actions/download-artifact@v4
        with:
          pattern: build-report-jdk*
          path: reports

      - name: Combine reports and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build status ([run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), commit ${{ github.event.pull_request.head.sha }})"
            for dir in reports/build-report-jdk*/; do
              jdk="$(basename "$dir" | sed 's/build-report-jdk//')"
              echo
              echo "#### JDK ${jdk}"
              echo
              if [ -f "${dir}build-report.md" ]; then
                cat "${dir}build-report.md"
              else
                echo "_No report available for this leg._"
              fi
            done
          } > combined-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --edit-last --create-if-none --body-file combined-report.md
