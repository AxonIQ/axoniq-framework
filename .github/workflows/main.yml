name: Axoniq Framework

on:
  push:
    branches:
      - main
      - 'axoniq-5.*.x'
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    name: Test and Build on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The build cache extension defaults to disabled (see .mvn/maven-build-cache-config.xml);
      # CI is the only place with the SNAPSHOT-fingerprinting safety net, so it is the only place
      # that opts back in.
      # The heap/metaspace cap keeps the Maven JVM itself from over-committing memory alongside its
      # forked test JVMs and the containers they start, on this repo's 2-vCPU CI runners. Metaspace
      # needs more headroom than the forked test JVMs: this one process compiles all 35 modules and
      # their annotation processors in-process across the whole reactor, so classes keep accumulating
      # instead of resetting per module like a fresh fork does. 128m was not enough -- it broke the
      # build with a Metaspace OOM partway through the reactor.
      MAVEN_OPTS: -Dmaven.build.cache.enabled=true -Xmx512m -XX:MaxMetaspaceSize=512m
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: 21
            deploy-enabled: true
          - java-version: 25
            deploy-enabled: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Restore/save Maven build cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/build-cache
          key: maven-build-cache-${{ runner.os }}-jdk${{ matrix.java-version }}-${{ github.run_id }}
          restore-keys: |
            maven-build-cache-${{ runner.os }}-jdk${{ matrix.java-version }}-

      - name: Fingerprint SNAPSHOT dependencies for build cache
        run: ./.github/scripts/fingerprint-snapshot-deps.sh

      - name: Write Axon Server test license
        run: |
          # Written to every module referencing SharedAxonServerContainer: Testcontainers' reuse hash doesn't
          # account for the license file copy, so whichever module's JVM starts the shared container first
          # determines whether it ends up licensed. Without the license present everywhere, an unlicensed
          # module could "poison" the shared container for modules that need multi-context support.
          for dir in integrationtests/support connector/axon-server-connector integrationtests/connector/axon-server integrationtests/conformance; do
            mkdir -p "$dir/src/test/resources"
            printf '%s' "$AXON_SERVER_LICENSE" > "$dir/src/test/resources/axon-server-test.license"
            echo "Axon Server test license written to $dir/src/test/resources/axon-server-test.license"
            echo "License file size: $(wc -c < "$dir/src/test/resources/axon-server-test.license") bytes"
          done
        env:
          AXON_SERVER_LICENSE: ${{ secrets.AXON_SERVER_LICENSE }}

      - name: Enable Testcontainers reuse
        run: printf 'testcontainers.reuse.enable=true\n' > ~/.testcontainers.properties

      - name: Regular Build
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -fae clean verify \
          -Possrh -Pintegration-test -Djacoco.skip=true -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2 -DforkedProcessTimeoutInSeconds=600
        env:
          AXONIQ_LICENSE: ${{ secrets.AXON_SERVER_LICENSE }}

      - name: Deploy to Sonatype
        if: success() && matrix.deploy-enabled
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Possrh deploy -DskipTests=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_ID }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASS }}

      - name: Notify run to Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: CAGSEC92A
          SLACK_COLOR: ${{ job.status }}
          SLACK_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
