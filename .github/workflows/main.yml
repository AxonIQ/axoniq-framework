name: Axoniq Framework

on:
  push:
    branches:
      - main
      - 'axoniq-5.*.x'
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    name: Test and Build on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: 21
            sonar-enabled: false
            deploy-enabled: true
          - java-version: 25
            sonar-enabled: false
            deploy-enabled: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Write Axon Server test license
        run: |
          mkdir -p integrationtests/src/test/resources
          printf '%s' "$AXON_SERVER_LICENSE" > integrationtests/src/test/resources/axon-server-test.license
          echo "Axon Server test license written to integrationtests/src/test/resources/axon-server-test.license"
          echo "License file size: $(wc -c < integrationtests/src/test/resources/axon-server-test.license) bytes"
        env:
          AXON_SERVER_LICENSE: ${{ secrets.AXON_SERVER_LICENSE }}

      - name: Regular Build
        if: ${{ !matrix.sonar-enabled }}
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always clean verify \
          -Possrh -Pintegration-test -Djacoco.skip=true -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2
      - name: Build with Coverage reports
        if: matrix.sonar-enabled
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always clean verify \
          -Dcoverage -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2

      - name: Sonar Analysis
        if: false # matrix.sonar-enabled | disabled for the time being
        run: |
          ./mvnw -B -ntp -Dstyle.color=always org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=AxonFramework_AxonFramework \
          -Dsonar.organization=axonframework \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Sonatype
        if: success() && matrix.deploy-enabled
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Possrh deploy -DskipTests=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_ID }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASS }}

      - name: Notify run to Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: CAGSEC92A
          SLACK_COLOR: ${{ job.status }}
          SLACK_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}