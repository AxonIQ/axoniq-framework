name: Axoniq Framework

on:
  push:
    branches:
      - main
      - 'axoniq-5.*.x'
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    name: Test and Build on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The build cache extension defaults to disabled (see .mvn/maven-build-cache-config.xml);
      # CI is the only place with the SNAPSHOT-fingerprinting safety net, so it is the only place
      # that opts back in.
      MAVEN_OPTS: -Dmaven.build.cache.enabled=true
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: 21
            sonar-enabled: false
            deploy-enabled: true
          - java-version: 25
            sonar-enabled: false
            deploy-enabled: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Restore/save Maven build cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/build-cache
          key: maven-build-cache-${{ runner.os }}-jdk${{ matrix.java-version }}-${{ github.run_id }}
          restore-keys: |
            maven-build-cache-${{ runner.os }}-jdk${{ matrix.java-version }}-

      - name: Fingerprint SNAPSHOT dependencies for build cache
        run: ./.github/scripts/fingerprint-snapshot-deps.sh

      - name: Write Axon Server test license
        run: |
          mkdir -p integrationtests/support/src/test/resources
          printf '%s' "$AXON_SERVER_LICENSE" > integrationtests/support/src/test/resources/axon-server-test.license
          echo "Axon Server test license written to integrationtests/support/src/test/resources/axon-server-test.license"
          echo "License file size: $(wc -c < integrationtests/support/src/test/resources/axon-server-test.license) bytes"
        env:
          AXON_SERVER_LICENSE: ${{ secrets.AXON_SERVER_LICENSE }}

      - name: Regular Build
        if: ${{ !matrix.sonar-enabled }}
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -fae clean verify \
          -Possrh -Pintegration-test -Djacoco.skip=true -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2
        env:
          AXONIQ_LICENSE: ${{ github.workspace }}/integrationtests/src/test/resources/axon-server-test.license
      - name: Build with Coverage reports
        if: matrix.sonar-enabled
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -fae clean verify \
          -Dcoverage -Dsurefire.rerunFailingTestsCount=5 -Dfailsafe.rerunFailingTestsCount=5 \
          -Dparallel=classes -DthreadCount=1 -DforkCount=2
        env:
          AXONIQ_LICENSE: ${{ github.workspace }}/integrationtests/src/test/resources/axon-server-test.license

      - name: Sonar Analysis
        if: false # matrix.sonar-enabled | disabled for the time being
        run: |
          ./mvnw -B -ntp -Dstyle.color=always org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=AxonFramework_AxonFramework \
          -Dsonar.organization=axonframework \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Sonatype
        if: success() && matrix.deploy-enabled
        run: |
          ./mvnw -B -U -ntp -Dstyle.color=always -Possrh deploy -DskipTests=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_ID }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASS }}

      - name: Notify run to Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: CAGSEC92A
          SLACK_COLOR: ${{ job.status }}
          SLACK_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
