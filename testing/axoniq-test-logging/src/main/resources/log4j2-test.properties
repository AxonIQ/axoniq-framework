# Default test logging configuration for all Axoniq Framework modules.
#
# Named "log4j2-test.properties" (rather than "log4j2.properties") so it takes
# precedence, per Log4j2's ConfigurationFactory search order, over the
# "log4j2.properties" bundled in Axon Framework's axon-eventsourcing test-jar.
#
# Policy: dependencies default to ERROR, Axoniq Framework and Axon Framework
# code default to WARN, with specific known-noisy loggers pinned to ERROR.

name=AxoniqFrameworkTestConfiguration

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %-30.30logger{1} - %msg%n

# Dependencies default to ERROR
rootLogger.level = ERROR
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT

# Axoniq Framework and Axon Framework default to WARN
logger.axoniq-framework.name = io.axoniq.framework
logger.axoniq-framework.level = WARN
logger.axoniq-framework.additivity = false
logger.axoniq-framework.appenderRefs = stdout
logger.axoniq-framework.appenderRef.stdout.ref = STDOUT

logger.axoniq-axonserver.name = io.axoniq.axonserver
logger.axoniq-axonserver.level = WARN
logger.axoniq-axonserver.additivity = false
logger.axoniq-axonserver.appenderRefs = stdout
logger.axoniq-axonserver.appenderRef.stdout.ref = STDOUT

logger.axon.name = org.axonframework
logger.axon.level = WARN
logger.axon.additivity = false
logger.axon.appenderRefs = stdout
logger.axon.appenderRef.stdout.ref = STDOUT

# Known-noisy exception: reconnect-loop logging in tests that intentionally
# disconnect/reconnect can produce ~1000 lines per build on its own.
logger.axonserver-managed-channel.name = io.axoniq.axonserver.connector.impl.AxonServerManagedChannel
logger.axonserver-managed-channel.level = ERROR

# Container start/reuse is a heavy, infrequent action worth always seeing: a few
# lines per container (image, container ID, and whether it was reused), not
# per-test noise.
logger.testcontainers.name = org.testcontainers
logger.testcontainers.level = INFO

# GenericContainer.logger() does not use a class-based org.testcontainers logger for its
# own create/reuse/started messages -- it logs through DockerLoggerFactory.getLogger(imageName),
# i.e. a separate "tc.<image>" logger per container, not covered by the override above.
logger.testcontainers-images.name = tc
logger.testcontainers-images.level = INFO

# SnapshottingEntityLifecycleHandlerTestSuite (Axon Framework) attaches a
# ListAppender to this logger and asserts on its INFO-level messages; the WARN
# default above would otherwise filter them out before the appender sees them.
logger.snapshotting-entity-lifecycle-handler.name = org.axonframework.eventsourcing.handler.SnapshottingEntityLifecycleHandler
logger.snapshotting-entity-lifecycle-handler.level = INFO

# Dead-letter tests intentionally fail events to exercise the dead-letter queue;
# each one logs a WARN with a full stack trace, which adds up fast across the
# concurrent/bulk dead-letter test scenarios.
logger.dead-lettered-event-processing-task.name = io.axoniq.framework.messaging.eventhandling.deadletter.DeadLetteredEventProcessingTask
logger.dead-lettered-event-processing-task.level = ERROR

# Logs a WARN (with stack trace) for every aborted Work Package, which is the
# expected outcome of the same intentional dead-letter test failures above.
logger.pooled-streaming-event-processor.name = org.axonframework.messaging.eventhandling.processing.streaming.pooled
logger.pooled-streaming-event-processor.level = ERROR

logger.shutdown-latch.name = org.axonframework.common.lifecycle.ShutdownLatch
logger.shutdown-latch.level = ERROR
